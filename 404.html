*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

header svg{height:24px;width:auto;display:block}
main{flex:1;display:grid;align-content:center;gap:clamp(28px,4vw,44px);max-width:1240px;width:100%;margin:0 auto;padding:clamp(40px,7vw,90px) clamp(20px,4.2vw,60px)}
.code{display:flex;align-items:center;gap:16px;font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--mute)}
.code b{color:var(--acc);font-weight:500}
.code::after{content:"";flex:1;height:1px;background:var(--line)}
.msgs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px)}
.msg h1{font:900 clamp(30px,4.6vw,60px)/1.25 var(--serif);text-wrap:balance}
.msg h1 em{font-style:normal;color:var(--acc)}
.msg p{color:var(--t2);margin-top:14px;max-width:24em}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;padding:12px 18px;border:1.5px solid var(--ink);border-radius:6px;font-weight:700;font-size:14.5px;transition:background-color .2s,color .2s}
.btn.solid{background:var(--sig);border-color:var(--sig)}
.btn:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.en .msg h1{font-family:var(--serif)}
.flat{display:flex;align-items:flex-end;gap:4px;height:clamp(60px,12vh,120px)}
.flat i{flex:1;height:6%;background:var(--ink);border-radius:2px 2px 0 0;animation:hum 2.6s ease-in-out infinite}
.flat i:nth-child(7n+3){animation-duration:3.1s}.flat i:nth-child(5n+1){animation-duration:2.2s}
.flat i.r{background:var(--sig);animation:blip 2.4s ease-in-out infinite}
@keyframes hum{0%,100%{height:5%}50%{height:9%}}
@keyframes blip{0%,70%,100%{height:6%}78%{height:85%}86%{height:30%}92%{height:60%}}
@media(max-width:760px){.msgs{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.flat i{animation:none}}
